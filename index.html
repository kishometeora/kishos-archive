<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE HOLOCRON ARCHIVE — Star Wars Collection</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holocron Archive">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;padding:0;background:#10151a;height:100%}
#errbox{display:none;position:fixed;top:0;left:0;right:0;background:#7a2020;color:#fff;font-family:monospace;font-size:11px;padding:10px;z-index:9999;white-space:pre-wrap}
#lockScreen{position:fixed;inset:0;background:#10151a;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:100}
#lockCard{width:280px;color:#e8e6df;text-align:center}
#lockCard .icon{font-size:32px;color:#4fc3c9;line-height:1}
#lockCard h1{font-size:16px;font-weight:600;color:#4fc3c9;letter-spacing:0.5px;margin:14px 0 4px}
#lockCard p{font-size:13px;color:#9a9689;margin:0 0 24px}
#pinInput{width:100%;box-sizing:border-box;background:#1b232b;border:1px solid #33404a;color:#e8e6df;font-size:22px;text-align:center;letter-spacing:12px;padding:12px;border-radius:8px;font-family:inherit}
#pinInput:focus{outline:none;border-color:#4fc3c9}
#pinError{font-size:13px;color:#e2857a;margin-top:10px;min-height:18px}
#unlockBtn{width:100%;margin-top:14px;background:#4fc3c9;color:#10151a;border:none;font-size:14px;font-weight:600;padding:12px;border-radius:8px;cursor:pointer;font-family:inherit}
#unlockBtn:active{opacity:0.85}
#lockNote{font-size:11px;color:#6b6a63;margin-top:20px;line-height:1.5}
#boot{color:#4fc3c9;font-family:-apple-system,sans-serif;text-align:center;padding:40vh 24px 0;font-size:15px}
</style>
</head>
<body>
<div id="errbox"></div>

<div id="lockScreen">
  <div id="lockCard">
    <div class="icon">&#128274;</div>
    <h1>THE HOLOCRON ARCHIVE</h1>
    <p>Enter PIN to unlock</p>
    <input id="pinInput" type="tel" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="- - - -" />
    <div id="pinError"></div>
    <button id="unlockBtn">Unlock</button>
    <div id="lockNote">Remembered on this device.</div>
  </div>
</div>

<div id="root" style="display:none"><div id="boot">THE HOLOCRON ARCHIVE is loading…</div></div>

<script>
window.onerror = function(m, s, l, c, e){ var b = document.getElementById('errbox'); b.style.display='block'; b.textContent = 'Error: ' + m + ' @' + l + ':' + c; };

(function(){
  var mem = {};
  function safeGet(k){ try { return localStorage.getItem(k); } catch(_) { return (k in mem) ? mem[k] : null; } }
  function safeSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(_) { mem[k]=v; return true; } }
  window.storage = {
    get: function(k){ var v = safeGet(k); return Promise.resolve(v === null ? null : {key:k, value:v}); },
    set: function(k,v){ return Promise.resolve(safeSet(k,String(v))); },
    delete: function(k){ try { localStorage.removeItem(k); } catch(_) { delete mem[k]; } return Promise.resolve(true); }
  };
})();

(function(){
  var UNLOCK_KEY = "sw-archive-unlocked-v1";
  var PIN = "1138";
  var lockScreen = document.getElementById("lockScreen");
  var root = document.getElementById("root");
  var pinInput = document.getElementById("pinInput");
  var pinError = document.getElementById("pinError");
  var unlockBtn = document.getElementById("unlockBtn");

  function reveal(){
    lockScreen.style.display = "none";
    root.style.display = "block";
    if (window.__mountArchive) window.__mountArchive();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    }
  }

  var already = false;
  try { already = localStorage.getItem(UNLOCK_KEY) === "yes"; } catch(_) {}
  if (already) {
    reveal();
  } else {
    pinInput.focus();
  }

  function tryUnlock(){
    var v = pinInput.value.trim();
    if (!v) { pinError.textContent = "Enter a PIN first"; return; }
    if (v === PIN) {
      try { localStorage.setItem(UNLOCK_KEY, "yes"); } catch(_) {}
      reveal();
    } else {
      pinError.textContent = "Wrong PIN, try again";
      pinInput.value = "";
      pinInput.focus();
    }
  }
  unlockBtn.addEventListener("click", tryUnlock);
  pinInput.addEventListener("input", function(){ pinError.textContent = ""; });
  pinInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
})();
</script>
<script src="app.js"></script>
</body>
</html>
